name: goreleaser

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # pin the major explicitly: 'latest' is not latest, it resolves to the
          # action major's default line (v5 locked it to '~> v1').
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
